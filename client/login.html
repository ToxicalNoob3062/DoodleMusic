<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Pacifico&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Doodle Music</title>
        <style>
            input {
                background-color: black;
                outline: none;
                padding: 8px;
            }
            #sign {
                font-family: "Pacifico", cursive;
                font-weight: 400;
                font-style: normal;
            }
        </style>
    </head>
    <body class="w-screen bg-zinc-900 flex flex-col items-center pt-20 px-4">
        <h2 id="sign" class="text-4xl text-white mb-12 text-center">
            Login & Start Grooving with Doodle Music 🌟
        </h2>
        <form
            id="loginForm"
            class="bg-zinc-800 w-full max-w-[95%] sm:max-w-md md:max-w-lg lg:max-w-[500px] xl:max-w-[400px] p-6 text-white rounded-lg border border-red-500 flex flex-col gap-6"
        >
            <div
                class="flex items-center justify-center gap-3 border-b border-zinc-400 pb-3"
            >
                <img class="w-12 h-12" src="music.png" alt="logo" />
                <p class="text-2xl">Doodle Music</p>
            </div>
            <div class="flex flex-col gap-2">
                <label for="username">Username</label>
                <input
                    class="w-full border border-zinc-400 focus:border-red-500 rounded-md text-zinc-300 px-3 py-2"
                    type="text"
                    id="username"
                    name="username"
                    required
                />
            </div>
            <div class="flex flex-col gap-2">
                <label for="password">Password</label>
                <input
                    class="w-full border border-zinc-400 focus:border-red-500 rounded-md text-zinc-300 px-3 py-2"
                    type="password"
                    id="password"
                    name="password"
                    required
                />
            </div>
            <input
                id="submitBtn"
                class="bg-red-500 hover:bg-red-600 transition-colors duration-200 px-4 py-2 border border-zinc-400 focus:border-red-500 rounded-md text-white cursor-pointer mx-auto"
                type="button"
                value="Let's go"
            />
        </form>
        <script type="module" src="login.js"></script>
    </body>
</html>
