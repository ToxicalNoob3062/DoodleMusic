<!doctype html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Doodle Music</title>
        <style>
            input {
                background-color: black;
                outline: none;
                padding: 8px;
            }
            #sign {
                font-family: "Dancing Script", cursive;
                font-optical-sizing: auto;
                font-style: normal;
            }
        </style>
    </head>
    <body
        class="w-screen h-screen bg-zinc-900 flex flex-col items-center pt-20"
    >
        <h2 id="sign" class="text-4xl text-white mb-20">
            Login & Start Grooving with Doodle Music 🌟
        </h2>
        <form
            id="loginForm"
            class="bg-zinc-800 p-4 w-full h-auto sm:w-fit sm:h-fit text-white rounded-lg border-1 border-red-500"
        >
            <h3 class="flex border-b border-zinc-400 p-2 justify-center">
                <img class="w-12 h-12" src="music.png" />
                <p class="text-xl">Doodle Music</p>
            </h3>
            <label for="username">Username:</label>
            <input
                class="m-4 border-1 border-zinc-400 focus:border-red-500 rounded-md text-zinc-300"
                type="text"
                id="username"
                name="username"
                required
            />
            <br />
            <label for="password">Password:</label>
            <input
                class="m-4 border-1 border-zinc-400 focus:border-red-500 rounded-md text-zinc-300"
                type="password"
                id="password"
                name="password"
                required
            />
            <br />

            <input
                id="submitBtn"
                class="block mx-auto px-4 py-2 border-1 border-zinc-400 focus:border-red-500 rounded-md text-zinc-300 cursor-pointer"
                type="button"
                value="Let's go"
            />
        </form>
        <script type="module" src="login.js"></script>
    </body>
</html>
