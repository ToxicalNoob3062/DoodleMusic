<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Doodle Music</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
        <style>
            .hide-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .hide-scrollbar {
                -ms-overflow-style: none; /* IE 10+ */
                scrollbar-width: none; /* Firefox */
            }
        </style>
    </head>
    <body
        class="bg-zinc-900 text-slate-300 flex gap-5 justify-center h-screen w-screen p-10"
    >
        <div
            id="playlist_container"
            class="w-1/3 h-[95vh] overflow-y-scroll hide-scrollbar p-4 border-r border-slate-300"
        ></div>
        <div
            id="search_container"
            class="w-1/3 h-[95vh] overflow-y-scroll hide-scrollbar flex flex-col p-4"
        ></div>
        <script type="module" src="index.js"></script>
    </body>
</html>
