<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Doodle Music</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
        <style>
            .hide-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .hide-scrollbar {
                -ms-overflow-style: none; /* IE 10+ */
                scrollbar-width: none; /* Firefox */
            }
        </style>
    </head>
    <body
        class="bg-zinc-900 text-slate-300 flex justify-center h-screen w-screen p-2 sm:p-10"
    >
        <div
            id="user_container"
            class="w-full sm:w-1/2 overflow-y-scroll hide-scrollbar p-2 sm:p-4"
        >
            <h3
                class="w-36 h-36 flex p-2 gap-4 items-center border-2 border-y-1 border-r-0 border-red-500 rounded-full"
            >
                <img class="w-12 h-12" src="music.png" />
                <p class="text-4xl">Doodle <br />Music</p>
            </h3>
            <h3 class="text-4xl text-center mt-4">App Users</h3>
            <div
                id="people"
                class="w-full h-[95vh] overflow-y-scroll hide-scrollbar border-t border-slate-300 mt-6 mx-auto"
            ></div>
        </div>
        <script type="module" src="users.js"></script>
    </body>
</html>
